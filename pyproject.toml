[project]
name = "zhixia"
version = "0.1.0"
description = "ZhiXia - 离线智能语音助手 (RK3588)"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"
keywords = ["voice-assistant", "offline-ai", "rk3588", "speech-recognition", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
authors = [
    { name = "ZhiXia Team" },
]
maintainers = [
    { name = "ZhiXia Team" },
]

dependencies = [
    "numpy",
    "sounddevice",
]

[project.optional-dependencies]
asr-funasr = ["funasr", "modelscope"]
asr-whisper = ["faster-whisper"]
tts-piper = ["piper-tts"]
rag-chroma = ["chromadb>=0.4.0", "sentence-transformers>=2.2.0"]
dev = ["pytest", "ipykernel"]

[project.scripts]
zhixia = "zhixia.__main__:main"

[project.urls]
Homepage = "https://github.com/your-username/zhixia"
Documentation = "https://github.com/your-username/zhixia#readme"
Repository = "https://github.com/your-username/zhixia"
Issues = "https://github.com/your-username/zhixia/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["zhixia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
